<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac-Man</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #f5f5ff;
        font-family: Arial, sans-serif;
      }
      .card {
        max-width: 640px;
        padding: 2rem 2.5rem;
        border: 1px solid #2d3a5a;
        border-radius: 12px;
        background: rgba(17, 24, 39, 0.8);
        text-align: center;
      }
      h1 {
        margin-top: 0;
        color: #ffd84d;
      }
      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pac-Man</h1>
      <p>This repository contains a desktop Pygame game, not a browser app.</p>
      <p>To run the game locally, use Python directly:</p>
      <pre>python .\pacman_main.py</pre>
      <p>This container is set up to serve the project through Nginx as a static site.</p>
    </div>
  </body>
</html>
